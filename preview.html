<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101111">
<title>Lumen — Camera Preview</title>
<style>
:root{color-scheme:dark;--ink:#f5f2eb;--muted:#8e908d;--line:#ffffff14;--gold:#d9bd85;--panel:#191a19;--bg:#101111}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#34312a 0,#171817 45%,#101111 78%);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.phone{width:min(420px,100%);min-height:min(900px,calc(100vh - 44px));border:1px solid #ffffff19;border-radius:36px;background:linear-gradient(160deg,#191a19 0,#121313 46%,#101111 100%);box-shadow:0 35px 100px #000b, inset 0 1px #ffffff12;padding:18px 18px 13px;display:flex;flex-direction:column;gap:13px;overflow:hidden}.topbar{height:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.icon{border:1px solid var(--line);background:#ffffff08;color:#e5e1d8;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:15px}.left{justify-self:start}.right{justify-self:end}.wordmark{text-align:center;font-size:11px;font-weight:650;letter-spacing:.24em}.wordmark small{display:block;color:#99978f;font-size:7px;letter-spacing:.29em;margin-top:3px}.finder{height:clamp(310px,43vh,420px);min-height:310px;position:relative;border-radius:25px;overflow:hidden;background:#26302b;box-shadow:0 14px 36px #0006,inset 0 0 0 1px #ffffff2a}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.finder:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 20%,transparent 64%,#0008);pointer-events:none}.grid{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,transparent 33.18%,#ffffff42 33.33%,transparent 33.48%,transparent 66.52%,#ffffff42 66.67%,transparent 66.82%),linear-gradient(0deg,transparent 33.18%,#ffffff42 33.33%,transparent 33.48%,transparent 66.52%,#ffffff42 66.67%,transparent 66.82%);opacity:.52}.finder-top,.finder-bottom{position:absolute;z-index:2;left:13px;right:13px;display:flex;justify-content:space-between;align-items:center}.finder-top{top:13px}.finder-bottom{bottom:13px}.badge{background:#1011109c;backdrop-filter:blur(16px);border:1px solid #ffffff20;border-radius:30px;padding:7px 10px;color:#f2eee5;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.record{color:#ff776c}.focus{position:absolute;z-index:2;width:37px;height:37px;left:56%;top:43%;border:1px solid #ead8a9;border-radius:4px;filter:drop-shadow(0 0 4px #0008)}.focus:before,.focus:after{content:"";position:absolute;background:#ead8a9}.focus:before{width:1px;height:8px;left:17px;top:14px}.focus:after{height:1px;width:8px;left:14px;top:17px}.lens-strip{display:flex;gap:8px;background:#111311bd;backdrop-filter:blur(16px);border:1px solid #ffffff1c;padding:5px;border-radius:30px}.lens{border:0;background:transparent;color:#e0ddd5;border-radius:24px;padding:7px 9px;font:10px ui-monospace,SFMono-Regular,monospace}.lens.active{background:#eee9dc;color:#151615;font-weight:700}.meterline{display:flex;justify-content:space-between;align-items:center;padding:0 2px}.readout{font:10px ui-monospace,SFMono-Regular,monospace;color:#e2ded4;letter-spacing:.04em}.readout b{font-weight:500;color:var(--gold)}.exposure{color:#b6b3ab}.settings{background:linear-gradient(135deg,#20211f,#191a19);border:1px solid var(--line);border-radius:18px;padding:12px 13px 11px}.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.settings-head strong{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#d7d3ca;font-weight:600}.settings-head span{font:9px ui-monospace,monospace;color:#8c8c86}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.control{border:1px solid #ffffff0d;background:#111211;border-radius:11px;padding:8px 7px 7px;min-width:0}.control button{font:inherit}.control[type=button]{text-align:left;color:inherit;cursor:pointer}.control:active{border-color:#d9bd8580}.quick{display:flex;gap:8px}.quick button{border:1px solid var(--line);background:#ffffff07;color:#aaa99f;border-radius:20px;padding:6px 10px;font:9px ui-monospace,monospace;cursor:pointer}.quick button.on{color:#181916;background:var(--gold);border-color:var(--gold)}.control label{display:block;color:#858780;font:8px ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em;margin-bottom:4px}.control strong{font:12px ui-monospace,SFMono-Regular,monospace;color:#f2eee5;white-space:nowrap}.filters{display:flex;gap:12px;overflow:auto;scrollbar-width:none;padding:1px 0 2px}.filters::-webkit-scrollbar{display:none}.filter{border:0;background:transparent;color:#858780;padding:0;min-width:58px;text-align:left;font:8px ui-monospace,monospace;letter-spacing:.02em}.swatch{height:42px;border-radius:10px;margin-bottom:6px;border:1px solid #ffffff20;position:relative;overflow:hidden;background:linear-gradient(140deg,#dbc291 0%,#9d8c6c 32%,#41534e 62%,#273531 100%)}.swatch:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,#fff4,transparent 55%)}.f-neutral{filter:saturate(.55) brightness(1.04)}.f-bw{filter:grayscale(1) contrast(1.15)}.f-leica{filter:saturate(1.2) sepia(.14) contrast(1.08)}.f-hassel{filter:saturate(.8) brightness(1.08)}.f-fuji{filter:saturate(1.32) hue-rotate(-8deg) contrast(1.08)}.f-dusk{filter:hue-rotate(25deg) saturate(.8) brightness(.82)}.filter.active{color:#f8f4ec}.filter.active .swatch{outline:1px solid var(--gold);outline-offset:2px}.footer{margin-top:auto}.modes{display:flex;align-items:center;justify-content:center;gap:17px;white-space:nowrap;overflow:auto;scrollbar-width:none;padding:1px 0 11px;color:#767873;font:9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em}.modes .active{color:var(--gold)}.capture{display:flex;align-items:center;justify-content:space-between;padding:1px 18px 0}.thumb{width:40px;height:40px;border-radius:11px;border:1px solid #ffffff30;background:linear-gradient(145deg,#d5bd91,#53625a 55%,#303936);box-shadow:inset 0 0 0 2px #101110;position:relative}.thumb:after{content:"";position:absolute;inset:0;border-radius:10px;background:#0002}.shutter{width:68px;height:68px;border:1px solid #ffffffa8;border-radius:50%;padding:5px;background:transparent;box-shadow:0 0 0 4px #ffffff16}.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#fffefa,#d8d5ca);box-shadow:inset 0 1px 2px #fff}.flip{width:40px;height:40px;border:1px solid #ffffff30;background:#ffffff08;color:#e8e4db;border-radius:50%;font-size:16px}.home{height:4px;width:105px;background:#f6f4ee;border-radius:8px;margin:14px auto 0;opacity:.85}.caption{color:#81827e;font-size:10px;text-align:center;margin-top:6px}@media(max-height:790px){body{padding:0}.phone{min-height:100vh;border-radius:0;padding-top:12px;gap:9px}.finder{height:38vh;min-height:235px}.swatch{height:34px}.settings{padding:9px 11px}.home{margin-top:7px}}
</style>
</head>
<body>
<main class="phone">
  <header class="topbar"><button class="icon left" aria-label="Settings">☼</button><div class="wordmark">LUMEN<small>PRO CAMERA</small></div><button class="icon right" id="flashTop" aria-label="Flash">ϟ</button></header>
  <section class="finder" aria-label="Camera viewfinder">
    <svg class="scene" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#99aaa1"/><stop offset=".55" stop-color="#d2b995"/><stop offset="1" stop-color="#856a52"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#778176"/><stop offset="1" stop-color="#34413a"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#697b71"/><stop offset="1" stop-color="#283631"/></linearGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values=".3 0 0 0 .2 .3 0 0 0 .2 .3 0 0 0 .2 0 0 0 .14 0"/></filter></defs><rect width="800" height="1000" fill="url(#sky)"/><circle cx="548" cy="230" r="92" fill="#f5d7a3" opacity=".65"/><path d="M0 480 150 355 244 428 375 287 506 430 618 330 800 475V720H0Z" fill="#647068"/><path d="m0 550 152-110 104 100 140-160 150 176 122-128 132 99v230H0Z" fill="url(#hill)"/><path d="M0 640q185-46 370 13t430-12v359H0Z" fill="url(#water)"/><path d="M0 694q195-42 390 6t410-3M0 760q200-26 400 8t400-3M40 838q175-18 350 8t370-4" fill="none" stroke="#d4c3a1" stroke-opacity=".24" stroke-width="5"/><g fill="#25332d"><path d="M62 535h26v180H62zM40 557q35-126 70 0zM116 586h18v126h-18zM99 597q27-94 52 0z"/><path d="M694 514h24v197h-24zM666 541q40-142 82 0zM740 578h15v132h-15zM720 584q28-94 55 0z"/></g><rect width="800" height="1000" filter="url(#grain)" opacity=".26"/></svg>
    <div class="grid"></div><i class="focus"></i>
    <div class="finder-top"><span class="badge">●&nbsp; PHOTO</span><button class="badge" id="resolutionBadge" type="button">RAW&nbsp; 48 MP</button></div>
    <div class="finder-bottom"><div class="lens-strip" id="lenses"><button class="lens">0.5×</button><button class="lens active">1×</button><button class="lens">2×</button><button class="lens">3×</button><button class="lens">5×</button></div><span class="badge">LEVEL&nbsp; 0.0°</span></div>
  </section>
  <div class="meterline"><span class="readout">ISO <b>100</b>&nbsp;&nbsp; 1/120s&nbsp;&nbsp; WB 5600K</span><span class="readout exposure">EV&nbsp; <b>−0.3</b></span></div>
  <section class="settings"><div class="settings-head"><strong>Capture settings</strong><span id="format">48 MP · ProRAW</span></div><div class="controls"><button class="control" type="button" data-setting="resolution"><label>RESOLUTION</label><strong>4K UHD</strong></button><button class="control" type="button" data-setting="fps"><label>FRAME RATE</label><strong>60 FPS</strong></button><button class="control" type="button" data-setting="flash"><label>FLASH</label><strong>AUTO</strong></button><button class="control" type="button" data-setting="format"><label>FORMAT</label><strong>RAW + HEIF</strong></button></div></section><div class="quick"><button id="timerToggle" type="button">TIMER · OFF</button><button id="stampToggle" type="button">TIMESTAMP · OFF</button><button id="gridToggle" class="on" type="button">GRID · ON</button></div>
  <section class="filters" id="filters" aria-label="Color looks"><button class="filter active"><div class="swatch f-leica"></div>LEICA LOOK</button><button class="filter"><div class="swatch f-hassel"></div>HASSELBLAD</button><button class="filter"><div class="swatch f-fuji"></div>FUJIFILM</button><button class="filter"><div class="swatch f-neutral"></div>NEUTRAL</button><button class="filter"><div class="swatch f-bw"></div>BLACK &amp; WHITE</button><button class="filter"><div class="swatch f-dusk"></div>DUSK</button></section>
  <footer class="footer"><nav class="modes" id="modes"><span class="active">PHOTO</span><span>PORTRAIT</span><span>VIDEO</span><span>CINEMATIC</span><span>SLOW MO</span><span>TIME-LAPSE</span><span>PANO</span></nav><div class="capture"><button class="thumb" aria-label="Recent photo"></button><button class="shutter" aria-label="Take photo"><span></span></button><button class="flip" aria-label="Switch camera">⟳</button></div><div class="home"></div><p class="caption" id="status">iPhone 15 Pro Max · Main Camera</p></footer>
</main>
<script>
const state={resolution:0,fps:2,flash:0,format:2,timer:0,stamp:false,grid:true,mp:48};
const options={resolution:['HD','4K UHD'],fps:['24 FPS','30 FPS','60 FPS'],flash:['AUTO','ON','OFF'],format:['JPEG','HEIF','RAW + HEIF']};
document.querySelectorAll('[data-setting]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.setting;state[key]=(state[key]+1)%options[key].length;button.querySelector('strong').textContent=options[key][state[key]];if(key==='flash')document.querySelector('#flashTop').textContent=options.flash[state.flash]==='OFF'?'ϟ̸':'ϟ';if(key==='format'){state.mp=state.format===2?48:12;document.querySelector('#format').textContent=`${state.mp} MP · ${options.format[state.format]}`;document.querySelector('#resolutionBadge').textContent=`${state.format===2?'RAW':'HEIF'}  ${state.mp} MP`}}));
document.querySelector('#flashTop').addEventListener('click',()=>{state.flash=(state.flash+1)%3;document.querySelector('[data-setting="flash"] strong').textContent=options.flash[state.flash];document.querySelector('#flashTop').textContent=state.flash===2?'ϟ̸':'ϟ'});
document.querySelector('#resolutionBadge').addEventListener('click',()=>{state.mp=state.mp===48?12:48;document.querySelector('#resolutionBadge').textContent=`${state.format===2?'RAW':'HEIF'}  ${state.mp} MP`;document.querySelector('#format').textContent=`${state.mp} MP · ${options.format[state.format]}`});
document.querySelector('#timerToggle').addEventListener('click',e=>{state.timer=(state.timer+1)%3;e.currentTarget.textContent=['TIMER · OFF','TIMER · 3 SEC','TIMER · 10 SEC'][state.timer];e.currentTarget.classList.toggle('on',state.timer!==0)});
document.querySelector('#stampToggle').addEventListener('click',e=>{state.stamp=!state.stamp;e.currentTarget.classList.toggle('on',state.stamp);e.currentTarget.textContent=`TIMESTAMP · ${state.stamp?'ON':'OFF'}`});
document.querySelector('#gridToggle').addEventListener('click',e=>{state.grid=!state.grid;document.querySelector('.grid').style.display=state.grid?'':'none';e.currentTarget.classList.toggle('on',state.grid);e.currentTarget.textContent=`GRID · ${state.grid?'ON':'OFF'}`});
document.querySelectorAll('#lenses .lens').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#lenses .lens').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.querySelectorAll('#filters .filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters .filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const classMap={'LEICA LOOK':'f-leica','HASSELBLAD':'f-hassel','FUJIFILM':'f-fuji','NEUTRAL':'f-neutral','BLACK & WHITE':'f-bw','DUSK':'f-dusk'};document.querySelector('.scene').style.filter=`${b.textContent==='LEICA LOOK'?'saturate(1.2) sepia(.14) contrast(1.08)':b.textContent==='HASSELBLAD'?'saturate(.8) brightness(1.08)':b.textContent==='FUJIFILM'?'saturate(1.32) hue-rotate(-8deg) contrast(1.08)':b.textContent==='NEUTRAL'?'saturate(.55) brightness(1.04)':b.textContent==='BLACK & WHITE'?'grayscale(1) contrast(1.15)':'hue-rotate(25deg) saturate(.8) brightness(.82)'}` }));document.querySelectorAll('#modes span').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#modes span').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#status').textContent=b.textContent==='PHOTO'?'iPhone 15 Pro Max · Main Camera':`Preview mode · ${b.textContent}`}));
</script>
</body></html>
